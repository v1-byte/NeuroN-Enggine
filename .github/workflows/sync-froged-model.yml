name: Sync Froged N1 model metadata

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-froged-model
  cancel-in-progress: true

jobs:
  sync-model-lock:
    name: Refresh Froged N1 lock manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Query Hugging Face and refresh lock manifest
        run: python scripts/sync_froged_model.py --out model/froged-n1-model-lock.json

      - name: Commit changed model metadata
        run: |
          if git diff --quiet -- model/froged-n1-model-lock.json; then
            echo "Froged N1 metadata is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/froged-n1-model-lock.json
          git commit -m "chore(model): sync Froged N1 metadata"
          git push
