name: Build and publish Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and attach the APK to
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    name: Build universal APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ORG_GRADLE_PROJECT_withNative: 'true'
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze and test Flutter
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test

      - name: Test Kotlin modules
        run: ./gradlew testDebugUnitTest :server:compileDebugKotlin --no-daemon

      - name: Require and configure production release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          missing=0
          for value in "${values[@]}"; do
            if [ -z "$value" ]; then missing=$((missing + 1)); fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing secrets are incomplete." >&2
            exit 1
          fi
          KEYSTORE="$GITHUB_WORKSPACE/flutter_app/android/neuron-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > flutter_app/android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "APK_SIGNING_LABEL=release-signed" >> "$GITHUB_ENV"

      - name: Build universal release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APK=flutter_app/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify "$APK"

      - name: Prepare APK and checksum
        run: |
          APK="NeuroN-Engine-${RELEASE_TAG}-universal-${APK_SIGNING_LABEL}.apk"
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$APK_FILE" "$APK_FILE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
